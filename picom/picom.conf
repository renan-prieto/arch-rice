#################################
# BACKEND
#################################

backend = "glx";
vsync = true;

#################################
# SOMBRAS
#################################

shadow = true;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.55;

#################################
# TRANSPARÊNCIA
#################################

active-opacity = 0.50;
inactive-opacity = 0.50;
frame-opacity = 1.00;

#################################
# BLUR
#################################

blur-method = "dual_kawase";
blur-strength = 20;

# Áreas que serão borradas
blur-background = true;
blur-background-frame = true;

#################################
# REGRAS DE BLUR
#################################

blur-background-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",
    "class_g = 'Wofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'notification'",
    "window_type = 'tooltip'"
];

#################################
# FADING
#################################

fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
# ARREDONDAMENTO
#################################

corner-radius = 0;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#################################
# PERFORMANCE
#################################

use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

#################################
# WINTYPES
#################################

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
    popup = { opacity = 0.95; };
    menu = { opacity = 0.95; };
};


inactive-dim = 0.30;

inactive-dim-fixed = true;

opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'firefox'",
    "100:class_g = 'org.vinegarhq.Sober'",
    "100:class_g = 'discord'",

];
