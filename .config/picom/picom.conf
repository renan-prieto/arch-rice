#############################################
# PICOM — i3 / X11
#############################################

#############################################
# BACKEND / PERFORMANCE
#############################################

backend = "glx";

vsync = true;

use-damage = true;

no-frame-pacing = false;

dithered-present = true;

unredir-if-possible = true;

unredir-if-possible-delay = 0;


rules = (

    # =====================================
    # WORKSPACE — DIREÇÃO 1
    # =====================================

    {
        match = "_MY_CUSTOM_WORKSPACE_SWITCH@ = 1";

        animations = (

            # Janela entrando
            {
                triggers = [ "open", "show" ];

                offset-x = {
                    duration = 0.55;
                    start = -180;
                    end = 0;

                    curve = "cubic-bezier(0.34, 1.56, 0.64, 1)";
                };
            },

            # Janela saindo
            {
                triggers = [ "close", "hide" ];

                offset-x = {
                    duration = 0.55;
                    start = 0;
                    end = 180;

                    curve = "cubic-bezier(0.34, 1.56, 0.64, 1)";
                };
            }

        );
    },


    # =====================================
    # WORKSPACE — DIREÇÃO 2
    # =====================================

    {
        match = "_MY_CUSTOM_WORKSPACE_SWITCH@ = 2";

        animations = (

            # Janela entrando
            {
                triggers = [ "open", "show" ];

                offset-x = {
                    duration = 0.55;
                    start = 180;
                    end = 0;

                    curve = "cubic-bezier(0.34, 1.56, 0.64, 1)";
                };
            },

            # Janela saindo
            {
                triggers = [ "close", "hide" ];

                offset-x = {
                    duration = 0.55;
                    start = 0;
                    end = -180;

                    curve = "cubic-bezier(0.34, 1.56, 0.64, 1)";
                };
            }

        );
    },


    # =====================================
    # ROFI
    # =====================================

    {
        match = "class_i = 'rofi'";

        animations = (

            {
                triggers = [ "open" ];

                preset = "slide-in";
                direction = "down";
                duration = 0.2;
            },

            {
                triggers = [ "close" ];

                preset = "slide-out";
                direction = "down";
                duration = 0.2;
            }

        );
    },


    # =====================================
    # POLYBAR TOP
    # =====================================

    {
        match = "name = 'polybar-top'";

        animations = (

            {
                triggers = [ "open", "show" ];

                preset = "slide-in";
                direction = "up";
                duration = 0.25;
            },

            {
                triggers = [ "close", "hide" ];

                preset = "slide-out";
                direction = "up";
                duration = 0.25;
            }

        );
    },


    # =====================================
    # POLYBAR BOTTOM
    # =====================================

    {
        match = "name = 'polybar-bottom'";

        animations = (

            {
                triggers = [ "open", "show" ];

                preset = "slide-in";
                direction = "down";
                duration = 0.25;
            },

            {
                triggers = [ "close", "hide" ];

                preset = "slide-out";
                direction = "up";
                duration = 0.25;
            }

        );
    }

);

animations = (

    # =====================================
    # ABRIR JANELA
    # =====================================

    {
        triggers = [ "open" ];

        offset-y = {
            duration = 0.45;
            start = 280;
            end = 0;
            curve = "cubic-bezier(0.34, 1.56, 0.64, 1)";
        };
    },


    # =====================================
    # FECHAR JANELA
    # =====================================

    {
        triggers = [ "close" ];

        preset = "disappear";
        duration = 0.25;
    },


    # =====================================
    # MOVER / REDIMENSIONAR
    # =====================================

    {
        triggers = [ "geometry" ];

        preset = "geometry-change";
        duration = 0.25;
    }

);
